name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Build standalone executable
        run: pyinstaller --clean --noconfirm cryptobox.spec
      - uses: actions/upload-artifact@v4
        with:
          name: cryptobox-${{ matrix.os }}
          path: dist/cryptobox*
          if-no-files-found: error

