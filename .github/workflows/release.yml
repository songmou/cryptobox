name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-14
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install .[dev]
      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm cryptobox.spec
      - name: Compute binary name
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="cryptobox-${TAG}.exe"; else BIN="cryptobox-${TAG}"; fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cryptobox-${{ matrix.os }}
          path: dist/${{ steps.meta.outputs.bin }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
